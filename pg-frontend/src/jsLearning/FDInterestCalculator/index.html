<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FD Rate Calculator </title>
</head>
<body>
    <div id = "wrapper">
        <h2>cm to inches</h2>
        <div class="inputDiv">
            <input type="text" id = "input" placeholder="Length in cm">
        </div>
        <div>
            <button  type="submit" onclick="convert()" > Convert To inches</button>
        </div>
        <div id = "result">

        </div>
    </div>
    <script>
        function convert(){
            const cmVal = Number(document.getElementById('input').value)
            const cToF= (cmVal*(9/5)) + 32
            // Assignment 
            // const inchVal = cmVal/2.54
            const result = document.getElementById('result')
            result.innerHTML = cToF.toFixed(3) + "inches"
        }
    </script>
</body>
</html>
