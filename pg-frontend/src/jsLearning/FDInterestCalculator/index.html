<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FD Rate Calculator </title>
</head>
<body>
    <div id = "wrapper">
        <h2>cm to inches</h2>
        <div class="inputDiv">
            <input type="text" id = "input" placeholder="Tenure months">
        </div>
        <div>
            <button  type="submit" onclick="fdRate()" > Calculate</button>
        </div>
        <div id = "result">

        </div>
    </div>
    <script>
        function fdRate(){
            const month = Number(document.getElementById('input').value);
            let ans = 0;
            if(month < 3){
                ans = 5.8;
            }
            else if (month >= 3 && month <= 6){
                ans = 6.5;
            }
            else if(month >= 7 && month <= 9 ){
                ans = 6.8;
            }
            else{
                ans = 7;
            }
            let id = document.getElementById('result')
            id.innerHTML = ans;
        }
    </script>
</body>
</html>
