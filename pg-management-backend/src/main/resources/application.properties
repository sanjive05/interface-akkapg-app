spring.application.name=pg-management-backend
server.port=8080

pg.storage.directory=${PG_DATA_DIR:./data}
# SQLite file is created automatically inside this directory: pg-management.db
pg.cors.allowed-origin=${PG_ALLOWED_ORIGIN:http://localhost:5173}

# Replace these before first startup. The bootstrap account is created only when users.xlsx is empty.
pg.admin.username=${PG_ADMIN_USERNAME:admin}
pg.admin.password=${PG_ADMIN_PASSWORD:ChangeMe123!}

# 32-byte-or-longer Base64 secret for HS256. Override for your own installation.
pg.security.jwt-secret=${PG_JWT_SECRET:VGhpc0lzQURlbW9uU2VjcmV0S2V5Rm9yUGdNYW5hZ2VtZW50U3lzdGVtMjAyNg==}
pg.security.jwt-expiration-ms=${PG_JWT_EXPIRATION_MS:28800000}

spring.jackson.serialization.write-dates-as-timestamps=false
